name: MainScene Android E2E

on:
  push:
    branches: [fix/main-scene-zero-state]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run server and hotpatch regression tests
        run: |
          python -m unittest discover -s work/offline -p 'test_*.py' -v
          python -m unittest discover -s work/tools -p 'test_*.py' -v

      - name: Download offline APK from public Drive artifact folder
        run: |
          python -m pip install --disable-pip-version-check gdown
          mkdir -p work/apk e2e work/offline/logs
          gdown 'https://drive.google.com/uc?id=1Xh77j3WtNAtAX-oIlIKQpox_O2oKgM2L' -O work/apk/base-offline.apk
          gdown 'https://drive.google.com/uc?id=1v13GnQTnJxE75vUm93HT6Xc-UgMJjqIy' -O work/apk/debug.keystore
          echo '03a0693a4878ecdcf09dd89638813f7fd0540de196bd7c5f4c2b6befd39d40ac  work/apk/base-offline.apk' | sha256sum -c -
          ls -lh work/apk/base-offline.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot Android 11 and exercise local login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash work/tools/android_e2e.sh

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-scene-android-e2e
          path: e2e/
          if-no-files-found: warn
