name: MainScene regression

on:
  push:
    branches:
      - fix/main-scene-zero-state
  pull_request:
    paths:
      - 'work/offline/**'
      - 'work/tools/**'
      - 'reference/lua/lua/net/**'
      - '.github/workflows/main-scene-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q work/offline work/tools
      - name: Run offline server tests
        run: python -m unittest discover -s work/offline -p 'test_*.py' -v
      - name: Run Lua hotpatch tests
        run: python -m unittest discover -s work/tools -p 'test_*.py' -v
